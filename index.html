    <!-- PERF-004: fontes servidas fora do caminho crítico de render.
         preconnect + preload assíncrono com fallback <noscript>; display=swap
         garante texto imediato com fonte do sistema até o webfont carregar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

      property="og:description"
      content="Sistema de gestão de colaboradores, obras e controle de vencimentos de documentos"
